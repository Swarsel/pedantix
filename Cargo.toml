[package]
name = "pedantix"
version = "1.0.0"
edition = "2024"
description = "The pedantic Nix formatter"
license = "MIT"
repository = "https://github.com/swarsel/pedantix"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-nix = "0.3"

[profile.release]
lto = true
